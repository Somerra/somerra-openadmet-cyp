[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "somerra-openadmet-cyp"
version = "0.1.0"
description = "Reproducible baselines for the OpenADMET CYP direct-inhibition and TDI tracks"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "huggingface-hub>=0.34,<2",
  "joblib>=1.4,<2",
  "lightgbm>=4.5,<5",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "rdkit>=2024.9.6",
  "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
reports = ["matplotlib>=3.9,<4"]
tracking = ["wandb==0.24.2"]

[project.scripts]
openadmet-cyp = "somerra_openadmet.cli:main"
openadmet-molecular-split = "somerra_openadmet.molecular_split_cli:main"
openadmet-cyp-research = "somerra_openadmet.cyp_research:main"
openadmet-cyp-build = "somerra_openadmet.cyp_submission:main"

[tool.hatch.build.targets.wheel]
packages = ["src/somerra_openadmet"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
